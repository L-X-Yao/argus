[build-system]
# SPDX license strings need setuptools >= 77 (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-gcs"
version = "3.7.7"
description = "Universal web-based ground control station for MAVLink drones"
readme = "README.md"
license = "MIT"
authors = [{name = "L-X-Yao", email = "lsc1476907630@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "websockets>=14.0,<17.0",
    "python-multipart>=0.0.31",  # CVE-2026-53538, CVE-2026-53539, CVE-2026-53540
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    # Not imported here: FastAPI brings them, and older ones have known holes.
    "starlette>=1.3.1",  # CVE-2026-54282, CVE-2026-54283
    "anyio>=4.14.2",  # CVE-2026-63374, CVE-2026-64847
]

[project.urls]
Homepage = "https://github.com/L-X-Yao/argus"
Repository = "https://github.com/L-X-Yao/argus"
Issues = "https://github.com/L-X-Yao/argus/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    # Starlette's test client asks for httpx2 since 1.8. httpx2 needs Python 3.11.
    "httpx2>=2.16; python_version >= '3.11'",
    "pytest-cov>=6.0",
    "ruff>=0.17,<0.18",  # npm run format:check needs CI and local on one formatter
    "pymavlink>=2.4.49",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
# pytest-asyncio warns until this is stated, and is about to change what it defaults to.
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = [
    "backend/server.py",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests/sitl_verify.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP031", "SIM105", "SIM102", "SIM108", "SIM115", "E402", "E741", "E701", "B023", "B904", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
