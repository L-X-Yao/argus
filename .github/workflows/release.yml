name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install deps
        run: |
          pip install -e '.[dev]'
          npm ci

      # Smoke test only — full test suite already ran in make-release.sh
      # before the tag was pushed. Re-running the full suite here would
      # double CI minutes for zero safety gain.
      - name: Smoke test
        run: |
          ruff check backend/ scripts/ tests/ --quiet
          npx svelte-check --tsconfig ./tsconfig.json
          python -m pytest tests/test_unit_*.py tests/test_contract_*.py -q --tb=line -x
          npx vitest run --bail 1 --reporter=dot

      - name: Build Windows package (amd64)
        run: python scripts/build_package.py --arch amd64

      - name: Audit what the package bundles
        run: |
          python scripts/package_requirements.py release/*.zip > bundled.txt
          cat bundled.txt
          pip install pip-audit
          pip-audit -r bundled.txt --no-deps --disable-pip

      - name: Checksum the package
        run: cd release && sha256sum *.zip > SHA256SUMS.txt

      - name: Attest where the package came from
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.zip

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            bash scripts/changelog.sh "$PREV_TAG" > RELEASE_NOTES.md
          else
            bash scripts/changelog.sh > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        # Not GitHub's own, and it runs with this job's write access: held to one commit.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release/*.zip
            release/SHA256SUMS.txt
