version: 2
updates:
  # Argus is in maintenance: minor and patch updates come as one pull request a month for npm and
  # one for pip. A major update comes on its own. A security update does not wait for the
  # schedule.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # svelte-check 4 crashes on TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["ci"]
